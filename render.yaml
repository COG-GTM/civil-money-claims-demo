# Official Render Blueprint; credentials are supplied only in Render's secret UI.
services:
  - type: pserv
    name: civil-datadog-agent
    runtime: image
    image:
      url: gcr.io/datadoghq/agent:7.73.0
    plan: starter
    region: frankfurt
    envVars:
      - key: DD_API_KEY
        sync: false
      - key: DD_SITE
        value: datadoghq.com
      - key: DD_ENV
        value: demo
      - key: DD_HOSTNAME
        value: civil-money-claims-render
      - key: PORT
        value: "8126"
      - key: DD_APM_ENABLED
        value: "true"
      - key: DD_APM_NON_LOCAL_TRAFFIC
        value: "true"
      # Render HTTPS log streams export stdout; no Docker socket exists on Render.
      - key: DD_LOGS_ENABLED
        value: "false"
      - key: DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED
        value: "false"
  - type: web
    name: civil-citizen-ui
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: citizen-ui/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - fromGroup: civil-money-claims-demo
      - key: DD_SERVICE
        value: civil-citizen-ui
      - key: DD_AGENT_HOST
        fromService:
          type: pserv
          name: civil-datadog-agent
          property: host
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: CIVIL_CASE_API_URL
        fromService:
          type: web
          name: civil-case-api
          property: hostport
      - key: LEGACY_CLAIM_STORE_URL
        fromService:
          type: web
          name: legacy-claim-store
          property: hostport
  - type: web
    name: civil-case-api
    runtime: docker
    plan: standard
    region: frankfurt
    dockerfilePath: civil-case-api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - fromGroup: civil-money-claims-demo
      - key: DD_SERVICE
        value: civil-case-api
      - key: DD_AGENT_HOST
        fromService:
          type: pserv
          name: civil-datadog-agent
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: civil-money-claims-db
          property: connectionString
      - key: DEMO_RESET_SQL
        value: /app/seed/modern/reset.sql
  - type: web
    name: legacy-claim-store
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: legacy-claim-store/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - fromGroup: civil-money-claims-demo
      - key: DD_SERVICE
        value: legacy-claim-store
      - key: DD_AGENT_HOST
        fromService:
          type: pserv
          name: civil-datadog-agent
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: civil-money-claims-db
          property: connectionString
      - key: LEGACY_SEED_LOCATION
        value: filesystem:/app/seed/legacy/migrations
      - key: DEMO_RESET_SQL
        value: /app/seed/legacy/reset.sql
databases:
  - name: civil-money-claims-db
    plan: basic-256mb
    region: frankfurt
    databaseName: claims
    user: claims
    postgresMajorVersion: "16"
    ipAllowList: []
envVarGroups:
  - name: civil-money-claims-demo
    envVars:
      - key: DD_ENV
        value: demo
      - key: DD_SITE
        value: datadoghq.com
      - key: DD_TRACE_ENABLED
        value: "true"
      - key: DD_TRACE_AGENT_PORT
        value: "8126"
      - key: DD_LOGS_INJECTION
        value: "true"
      - key: DEMO_RESET_ENABLED
        value: "true"
      - key: DEMO_RESET_TOKEN
        generateValue: true
