name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  citizen-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: citizen-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: citizen-ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  civil-case-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -s .mvn/settings.xml -f civil-case-api/pom.xml verify
  legacy-build-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -s .mvn/settings.xml -f legacy-claim-store/pom.xml -DskipTests package
  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
